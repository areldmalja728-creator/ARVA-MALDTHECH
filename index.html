<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARVA Initialization</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
        }
        .terminal {
            border: 1px solid #333;
            background-color: #000000;
            padding: 20px;
            border-radius: 5px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }
        .comment { color: #6a9955; }
        .bracket { color: #ffd700; }
        .tag { color: #4fc1ff; font-weight: bold; }
        .function { color: #dcdcaa; }
        .variable { color: #9cdcfe; }
        .status { color: #4ec9b0; }
    </style>
</head>
<body>

<div class="terminal">
    <p class="comment">// ARVA INITIALIZATION PROTOCOL</p>
    <p class="bracket">{</p>
    <p style="padding-left: 20px;">
        <span class="tag">[antivirus]</span> <span class="bracket">{</span> <span class="function">attiva_scudo_globale</span> <span class="bracket">}</span> (<span class="variable">check_malware</span>) ¬<br>
        <span class="tag">[BaseHTML]</span> <span class="bracket">{</span> <span class="function">carica_ambiente_mobile</span> <span class="bracket">}</span> (<span class="variable">engine_html</span>) ^
    </p>
    <p class="bracket">}</p>
    
    <hr style="border-color: #333; margin-top: 20px;">
    <p class="status">🟢 Stato: Ambiente HTML caricato sul PC.</p>
</div>

</body>
</html>
